name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # The root `prepare` builds every workspace, so this also proves the build
      # works from a clean tree. `tsc -b` orders the four projects; nothing
      # relies on npm running a per-workspace `prepare`.
      - run: npm ci

      - run: npm test

      # Nothing else typechecks the suites: tsx strips types without checking them.
      - run: npm run typecheck

      # Proves every `files` and `exports` path in all four manifests exists.
      - run: npm pack --workspaces --dry-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - run: npm ci

      # The plugin ships as source, so what has to hold is that the exact bytes
      # WordPress will serve parse — as PHP, and as JavaScript.
      - run: npm run --workspace @pterodoc/wp-plugin lint

      - run: npm run --workspace @pterodoc/wp-plugin build
